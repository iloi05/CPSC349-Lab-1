<!DOCTYPE html>
<html>
    <head>
        <title>Registration</title>
    </head>
    <body>
        <a href="index.html">Home</a> |
        <a href="courses.html">Courses</a> |
        <a href="registration.html">Registration</a>
        <br>
        <br>
        <form action="/register" method="POST">
            <label for="name">Student Name:</label>
            <input type="text" id="name" name="name">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
            <input type="radio" id="freshman" name="level" value="freshman">
            <label for="freshman">Freshman</label>
            <input type="radio" id="sophomore" name="level" value="sophomore">
            <label for="sophomore">Sophomore</label>
            <input type="radio" id="junior" name="level" value="junior">
            <label for="junior">Junior</label>
            <input type="radio" id="senior" name="level" value="senior">
            <label for="senior">Senior</label>
            <br><br>
            <input type="checkbox" id="web" name="interest" value="web">
            <label for="web">Web Development</label>
            <input type="checkbox" id="mobile" name="interest" value="mobile">
            <label for="mobile">Mobile Development</label>
            <input type="checkbox" id="AI" name="interest" value="AI">
            <label for="AI">Artificial Intelligence</label>
            <br><br>
            <label for="major">Major:</label>
            <select id="major" name="major">
                <option value="nothing">Select your major</option>
                <option value="cs">Computer Science</option>
                <option value="ce">Computer Engineering</option>
                <option value="math">Mathematics</option>
            </select>
            <br><br>
            <button type="submit">Register</button>
            <!--Question 5: When using GET, the browser placed the form data in the URL as query parameters.-->
            <!--Question 6: When using POST, the form data is sent in the request body, not in the URL.-->
            <!--Question 7: Live Server returns 405 Method Not Allowed for the POST request 
            because it does not support handling POST requests.-->
        </form>
    </body>
</html>
