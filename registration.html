<!DOCTYPE html>
<html>
    <body>
        <strong>Navigation&nbsp;</strong> 
        <a href="index.html">Home</a> |
        <!--Method browser used when clicked on courses hyperlink was GET-->
        <a href="courses.html">Courses</a> |
        <a href="registration.html">Registration</a>
        <br>
        <br>
        <!--The browser placed the form data in http://localhost:5500/register?name=John+Smith&password=abc123&level=Sophmore&interest=web&interest=AI&major=cs.-->
        <!--When using POST, the form data to http://localhost:5500/register-->
        <!--Live Server returns 405 Method for the POST request because it is rejected the method we used, which in this case is POST-->
        <form action="/register" method="POST">
            <label for="name">Student Name: </label>
            <input type="text" id="name" name="name">
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br>
            <input type="radio" id="Freshman" name="level" value="Freshman">
            <label for="Freshman">Freshman</label>
            <input type="radio" id="Sophmore" name="level" value="Sophmore">
            <label for="Freshman">Sophmore</label>
            <input type="radio" id="Junior" name="level" value="Junior">
            <label for="Freshman">Junior</label>
            <input type="radio" id="Senior" name="level" value="Senior">
            <label for="Freshman">Senior</label>
            <br>
            <input type="checkbox" id="web" name="interest" value="web">
            <label for="web">Web Development</label>
            <input type="checkbox" id="mobile" name="interest" value="mobile">
            <label for="web">Mobile Development</label>
            <input type="checkbox" id="AI" name="interest" value="AI">
            <label for="web">Artificial Intelligence</label>
            <br>
            <lable for="major">Major:</lable>
            <select id="major" name="major">
                <option value="cs">
                    Computer Science
                </option>
                <option value="ce">
                    Computer Engineering
                </option>
                <option value="math">
                    Mathematics
                </option>
            </select>
            <br>
            <button type="submit">
                Register
            </button>
        </form>
    </body>
</html>
